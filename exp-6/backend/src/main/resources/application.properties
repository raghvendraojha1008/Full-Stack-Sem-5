spring.application.name=scalable-read-api
server.port=8080

# ---- Database: in-memory H2 (data is re-seeded on every start) ----
spring.datasource.url=jdbc:h2:mem:feeddb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Lets the N+1 lab report how many SQL statements each strategy fired
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# Show validation messages (for example a bad sort field) in error responses
server.error.include-message=always

# ---- Pagination limits ----
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# ---- Cache: Ehcache 3 through JCache ----
spring.cache.type=jcache
spring.cache.jcache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.cache.jcache.config=classpath:ehcache.xml

# ---- Demo settings ----
app.seed.authors=25
app.seed.posts=2000
# Extra delay added to the analytics computation to imitate a heavy report.
# Set to 0 to measure only the real database work.
app.analytics.simulated-load-ms=200
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
